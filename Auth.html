<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بوابة الدخول والتسجيل | أكاديميا إيفنت</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: 'Cairo', sans-serif;
      background-color: #140D09;
      background-image: 
        radial-gradient(circle at 20% 15%, rgba(180, 100, 30, 0.25) 0%, transparent 45%),
        radial-gradient(circle at 80% 85%, rgba(40, 160, 120, 0.16) 0%, transparent 50%),
        radial-gradient(circle at 50% 50%, #140c08 0%, #080503 100%);
      color: #ffffff;
      min-height: 100vh;
    }
    .ios-3d-glass {
      background: linear-gradient(145deg, rgba(46, 30, 20, 0.72) 0%, rgba(20, 12, 8, 0.88) 100%);
      backdrop-filter: blur(30px) saturate(200%);
      -webkit-backdrop-filter: blur(30px) saturate(200%);
      border-radius: 24px;
      border: 1px solid rgba(255, 215, 150, 0.18);
      border-top: 1.5px solid rgba(255, 240, 210, 0.45);
      box-shadow: 0 20px 45px -10px rgba(0, 0, 0, 0.85), inset 0 1px 2px rgba(255, 255, 255, 0.35);
    }
    .glass-input-field {
      background: rgba(10, 6, 4, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: inset 0 3px 8px rgba(0, 0, 0, 0.7);
    }
    .role-tab.active {
      background: linear-gradient(135deg, rgba(217, 119, 6, 0.45) 0%, rgba(120, 60, 10, 0.65) 100%);
      border: 1px solid rgba(251, 191, 36, 0.65);
      color: #fde68a;
    }
    .glass-cta-btn {
      background: linear-gradient(180deg, #5eead4 0%, #0d9488 100%);
      color: #042f2e;
      border-top: 1.5px solid #ffffff;
      box-shadow: 0 6px 20px rgba(13, 148, 136, 0.45);
    }
  </style>
</head>
<body class="flex flex-col justify-center items-center px-4 py-8">

  <div class="w-full max-w-md ios-3d-glass p-6 space-y-5">
    <!-- الهيدر والرجوع -->
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="text-amber-400 font-black text-lg">أكاديميا إيفنت</span>
      </div>
      <a href="index.html" class="text-xs text-stone-300 hover:text-white">العودة للرئيسية ←</a>
    </div>

    <div class="text-right">
      <h1 class="text-xl font-black text-white">بوابة الدخول الأكاديمي الموحد</h1>
      <p class="text-xs text-stone-300 mt-1">اختر صفتك الأكاديمية لتسجيل الدخول أو إنشاء حساب جديد</p>
    </div>

    <!-- تبويبات اختيار الصفة (طالب / دكتور محكم / مشرف أدمن) -->
    <div class="grid grid-cols-3 gap-2 text-center text-xs font-bold">
      <button onclick="selectRole('student', 'طالب جامعي')" id="tab-student" class="role-tab active py-2.5 rounded-xl border border-white/10 transition">
        🎓 الطلاب والباحثين
      </button>
      <button onclick="selectRole('doctor', 'دكتور محكّم')" id="tab-doctor" class="role-tab py-2.5 rounded-xl border border-white/10 transition">
        👨‍🏫 الدكاترة واللجنة
      </button>
      <button onclick="selectRole('admin', 'مدير النظام')" id="tab-admin" class="role-tab py-2.5 rounded-xl border border-white/10 transition">
        🔒 إدارة المؤتمر
      </button>
    </div>

    <!-- فورم البيانات -->
    <form id="authForm" onsubmit="handleAuth(event)" class="space-y-3.5">
      <div id="signupFields" class="space-y-3">
        <div>
          <label class="block text-xs text-stone-300 mb-1">الاسم الرباعي (كما سيُطبع في الشهادة الموثقة)</label>
          <input type="text" id="fullName" placeholder="مثال: مروان سعيد..." class="glass-input-field w-full rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none">
        </div>
        <div>
          <label class="block text-xs text-stone-300 mb-1">الجامعة / الكلية</label>
          <input type="text" id="university" placeholder="مثال: كلية الحاسبات والمعلومات" class="glass-input-field w-full rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none">
        </div>
      </div>

      <div>
        <label class="block text-xs text-stone-300 mb-1">البريد الإلكتروني الجامعي أو الشخصي</label>
        <input type="email" id="email" required placeholder="name@example.com" class="glass-input-field w-full rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none" dir="ltr">
      </div>

      <div>
        <label class="block text-xs text-stone-300 mb-1">كلمة المرور</label>
        <input type="password" id="password" required placeholder="••••••••" class="glass-input-field w-full rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none" dir="ltr">
      </div>

      <button type="submit" id="submitBtn" class="glass-cta-btn w-full py-3 rounded-xl text-xs font-black transition active:scale-95">
        تسجيل حساب جديد / دخول فوري
      </button>
    </form>

    <div class="relative flex py-1 items-center">
      <div class="flex-grow border-t border-white/10"></div>
      <span class="flex-shrink mx-3 text-[11px] text-stone-400">أو التسجيل السريع</span>
      <div class="flex-grow border-t border-white/10"></div>
    </div>

    <!-- زر الدخول بحساب جوجل -->
    <button onclick="loginWithGoogle()" class="bg-white text-gray-900 w-full py-2.5 rounded-xl text-xs font-extrabold flex items-center justify-center gap-2 shadow-lg hover:bg-gray-100 transition">
      <span>المتابعة باستخدام حساب Google</span>
      <svg class="w-4 h-4" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
        <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.11-6.72-4.96H1.29v3.14C3.26 21.3 7.31 24 12 24z"/>
        <path fill="#FBBC05" d="M5.28 14.24c-.24-.72-.38-1.49-.38-2.24s.14-1.52.38-2.24V6.62H1.29C.47 8.24 0 10.06 0 12s.47 3.76 1.29 5.38l3.99-3.14z"/>
        <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.29 6.62l3.99 3.14c.95-2.85 3.6-4.96 6.72-4.96z"/>
      </svg>
    </button>

    <p id="statusMsg" class="text-center text-xs text-amber-300 font-bold hidden"></p>
  </div>

  <script src="app.js"></script>
  <script>
    let selectedRole = 'student';
    let selectedTitle = 'طالب جامعي';

    function selectRole(role, title) {
      selectedRole = role;
      selectedTitle = title;
      document.querySelectorAll('.role-tab').forEach(btn => btn.classList.remove('active'));
      document.getElementById('tab-' + role).classList.add('active');
    }

    async function handleAuth(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const fullName = document.getElementById('fullName').value || 'مستخدم أكاديمي';
      const university = document.getElementById('university').value || 'جامعة الجيزة';
      const msg = document.getElementById('statusMsg');

      msg.classList.remove('hidden');
      msg.textContent = "جاري التحقق وتأمين الاتصال بقاعدة البيانات...";

      // محاولة تسجيل الدخول أولاً
      let { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

      // لو الحساب مش موجود، ينشئ حساب جديد فوراً ويحفظ بياناته
      if (error) {
        const signUpRes = await supabaseClient.auth.signUp({
          email,
          password,
          options: { data: { full_name: fullName } }
        });

        if (signUpRes.error) {
          msg.textContent = "خطأ: " + signUpRes.error.message;
          return;
        }
        data = signUpRes.data;
      }

      if (data?.user) {
        await supabaseClient.from('profiles').upsert({
          id: data.user.id,
          full_name: fullName,
          email: email,
          university: university,
          academic_title: selectedTitle,
          role: selectedRole
        });

        msg.textContent = "✅ تم الدخول بنجاح! جاري تحويلك...";
        setTimeout(() => {
          window.location.href = (selectedRole === 'admin' || selectedRole === 'doctor') ? 'admin.html' : 'index.html';
        }, 1000);
      }
    }
  </script>
</body>
</html>
